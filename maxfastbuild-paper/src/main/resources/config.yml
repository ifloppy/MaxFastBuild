# Server-side CLI / admin message pack (messages_<lang>.yml). Client protocol still uses Fabric lang.
default-language: zh_cn
execution:
  ticks-per-block: 1
  blocks-per-step: 1
  max-region-blocks: 100000
  max-concurrent-tasks-per-player: 2
  # Documented for operators; offline pause is always applied in code today.
  pause-when-player-offline: true
  planning:
    # How many blocks are scanned per server tick while planning a large region.
    # Higher values finish faster but use more time per tick; lower values spread the load.
    blocks-per-tick: 2000
rate-limit:
  requests: 3
  interval-seconds: 10
  burst: 1
inventory:
  search-shulker-boxes: false
  # If true, search-shulker-boxes also requires permission maxfastbuild.material.shulker
  require-shulker-permission: false
economy:
  enabled: false
  per-operation:
    enabled: false
    price: 0.0
  per-area:
    enabled: false
    price: 0.0
  per-block:
    enabled: false
    price: 0.0
coreprotect:
  required: true
protocol:
  session-minutes: 30
  max-payload-bytes: 16384
