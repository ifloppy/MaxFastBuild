# Server-side CLI / admin message pack (messages_<lang>.yml). Client protocol still uses Fabric lang.
default-language: zh_cn
execution:
  ticks-per-block: 1
  blocks-per-step: 1
  # Maximum total block mutations performed per server tick across ALL running tasks.
  # Bounds worst-case main-thread work when many players build simultaneously; protects TPS.
  # 0 = unlimited (old behavior).
  global-blocks-per-tick: 4
  max-region-blocks: 100000
  # Client-side guard on the bounding-box volume of a single Litematica sub-region being read.
  # Separate from max-region-blocks: large builds (e.g. furnace arrays) have a box far bigger than
  # their block count because of the air in between. Only stops pathologically huge boxes that
  # would freeze the client. The real block cap is max-region-blocks.
  max-region-volume: 8000000
  max-concurrent-tasks-per-player: 2
  # How many server ticks between progress writes to SQLite (higher = less disk I/O, more progress lost on crash).
  save-interval-ticks: 20
  # Documented for operators; offline pause is always applied in code today.
  pause-when-player-offline: true
  # Maximum number of commands a single player may have waiting in the rate-limited queue.
  max-queued-commands-per-player: 32
  planning:
    # How many blocks are scanned per server tick while planning a large region.
    # Higher values finish faster but use more time per tick; lower values spread the load.
    blocks-per-tick: 2000
    # Maximum total blocks scanned per tick across ALL players planning simultaneously.
    # 0 = unlimited (old behavior).
    global-blocks-per-tick: 2000
  async-queue:
    # Offload SQLite writes to a background thread so the main server thread never blocks on I/O.
    enabled: true
    # How many queued writes to bundle into a single SQLite transaction.
    batch-size: 10
    # Maximum time (ms) to wait before flushing a partial batch.
    max-delay-ms: 200
rate-limit:
  requests: 3
  interval-seconds: 10
  burst: 1
inventory:
  search-shulker-boxes: false
  # If true, search-shulker-boxes also requires permission maxfastbuild.material.shulker
  require-shulker-permission: false
  # Search nearby containers for the items a paste needs, in addition to the player inventory.
  # Scanned: chests (incl. double), trapped chests, barrels, placed shulker boxes, and shulker
  # boxes nested inside any of those containers. Items consumed come from the container slot
  # directly; on a partial/cancelled paste they are returned to the exact source slot.
  search-containers: true
  # Horizontal/vertical radius (blocks, from the player's feet) for the container search above.
  container-search-radius: 5
  # Fire/soul fire are placed without consuming a fire item: a flint and steel anywhere in the
  # searched sources is required instead. Each fire block placed consumes 1 durability from it.
  fire-requires-flint-and-steel: true
  # Water/lava buckets in inventory (main + shulkers when enabled) required to place an
  # unlimited amount of that fluid. Buckets are never consumed; fewer than this count rejects.
  fluid-bucket-requirement: 2
economy:
  enabled: false
  per-operation:
    enabled: false
    price: 0.0
  per-area:
    enabled: false
    price: 0.0
  per-block:
    enabled: false
    price: 0.0
# Paid instant paste: executes synchronously (no queue wait) at a fixed economy multiplier.
# max-blocks 0 = unlimited (still bounded by execution.max-region-blocks and the protocol cap).
# WARNING: instant pastes run all blocks on the server main thread in one burst — very large
# pastes (e.g. tens of thousands of blocks) will briefly pause the server, like Litematica
# creative paste. Entity caps below are always enforced.
instant-paste:
  multiplier: 2
  max-blocks: 0
  max-entities: 64
  max-entities-per-chunk: 32
coreprotect:
  required: true
# Paste placement semantics.
paste:
  # Replace blocks that are already in the pasted region instead of skipping or stopping: a
  # position whose current state differs from the schematic is placed over (survival requires a
  # mining tool for solid occupants). Unbreakable / forbidden positions are skipped, never fatal.
  replace-mismatched: true
  # Extra redstone convergence passes after a paste finishes placing blocks, one per server tick.
  # Instant pastes place everything in a single tick; components that rely on scheduled ticks
  # (repeaters, pistons, observers) need a few ticks to settle against the final layout, like
  # Litematica's per-tick paste. 0 disables the tail.
  redstone-convergence: 2
debug:
  # Master switch for all MaxFastBuild diagnostic logging (paste lifecycle, tile readback,
  # /mfbadmin torches). Off by default; turn on only when debugging.
  enabled: false
  # When true, log every block-entity NBT apply (input SNBT, loadData result, and the tile read
  # back from the server) so sign/lectern/container text issues can be diagnosed live.
  # Only active while debug.enabled is also true.
  tile-readback: false
protocol:
  session-minutes: 30
  # Max bytes of a single gzipped paste payload part (NBT-heavy schematics need headroom).
  max-payload-bytes: 131072
