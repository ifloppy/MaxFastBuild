name: MaxFastBuild
version: '${version}'
main: dev.maxfastbuild.paper.MaxFastBuildPlugin
api-version: '26.2'
description: Secure server-authoritative mass building
authors: [MaxFastBuild]
softdepend: [Vault, CoreProtect]
commands:
  mfb:
    description: MaxFastBuild 建造指令（/mfb help）
    usage: /mfb <help|mode|pos1|pos2|material|hollow|apply|status|cancel>  (apply 由主手决定放置/破坏)
    permission: maxfastbuild.use
  mfbadmin:
    description: MaxFastBuild 管理指令
    usage: /mfbadmin <reload|recovery>
    permission: maxfastbuild.admin
permissions:
  maxfastbuild.use:
    description: 使用 /mfb 或客户端放置建造
    default: true
  maxfastbuild.break:
    description: 使用破坏建造（客户端或 /mfb apply break）
    default: true
  maxfastbuild.material.shulker:
    description: 在配置开启时允许从潜影盒取材料
    default: false
  # Explicit grants only — OP does NOT auto-bypass cost/materials/rate-limit.
  maxfastbuild.bypass.cost:
    default: false
  maxfastbuild.bypass.materials:
    default: false
  maxfastbuild.bypass.rate-limit:
    default: false
  maxfastbuild.admin:
    default: op
