name: MaxFastBuild
version: '${version}'
main: dev.maxfastbuild.paper.MaxFastBuildPlugin
api-version: '26.2'
description: Secure server-authoritative mass building
authors: [MaxFastBuild]
softdepend: [Vault, CoreProtect]
commands:
  mfb:
    description: MaxFastBuild building commands
    usage: /mfb <mode|pos1|pos2|apply|cancel|status|hollow|material>
    permission: maxfastbuild.use
  mfbadmin:
    description: MaxFastBuild administration
    usage: /mfbadmin <reload|recovery>
    permission: maxfastbuild.admin
permissions:
  maxfastbuild.use:
    description: Use place builds via client protocol or /mfb
    default: true
  maxfastbuild.break:
    description: Use break builds via client protocol
    default: true
  maxfastbuild.material.shulker:
    description: Allow counting/taking place materials from carried shulker boxes when configured
    default: false
  # Explicit grants only — OP does NOT auto-bypass cost/materials/rate-limit.
  maxfastbuild.bypass.cost:
    default: false
  maxfastbuild.bypass.materials:
    default: false
  maxfastbuild.bypass.rate-limit:
    default: false
  maxfastbuild.admin:
    default: op
