help-header: "<gold>===== MaxFastBuild 指令帮助 =====</gold>"
help-line-mode: "<yellow>/mfb mode <形状></yellow> <gray>— 设置建造形状</gray>"
help-line-pos1: "<yellow>/mfb pos1</yellow> <gray>— 将当前位置设为点 1</gray>"
help-line-pos2: "<yellow>/mfb pos2</yellow> <gray>— 将当前位置设为点 2</gray>"
help-line-material: "<yellow>/mfb material <方块ID></yellow> <gray>— 设置放置材料（如 minecraft:stone）</gray>"
help-line-hollow: "<yellow>/mfb hollow [true|false]</yellow> <gray>— 空心模式</gray>"
help-line-apply: "<yellow>/mfb apply</yellow> <gray>— 按主手提交：方块=放置/替换，工具=破坏，空手拒绝</gray>"
help-line-status: "<yellow>/mfb status</yellow> <gray>— 查看选区与任务</gray>"
help-line-cancel: "<yellow>/mfb cancel</yellow> <gray>— 取消自己的进行中任务</gray>"
help-line-about: "<yellow>/mfb about</yellow> <gray>— 显示插件信息</gray>"
help-line-setblock: "<yellow>/mfbsetblock <x y z> <方块> [replace|destroy|keep]</yellow> <gray>— 兼容 MC /setblock 的单方块放置</gray>"
help-line-help: "<yellow>/mfb help</yellow> <gray>— 显示本帮助</gray>"
help-modes: "<gray>形状：单方块(single) 直线(line) 墙(wall) 地板(floor) 立方体(cube) 对角线(diagonal_line) 对角墙(diagonal_wall) 斜坡地板(slope_floor) 圆(circle) 圆柱(cylinder) 球体(sphere) 棱锥(pyramid) 圆锥(cone)</gray>"
help-tip: "<gray>流程：mode → pos1 → pos2 → 主手持方块或工具 → apply。与客户端 /__mfb 同一套主手判定。也可用 Fabric 径向菜单。</gray>"

