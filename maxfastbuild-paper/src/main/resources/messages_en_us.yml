mode-effect-cylinder: "make a cylinder from the selected range"
mode-effect-sphere: "make an ellipsoid/sphere inside the selected range"
mode-effect-pyramid: "make a pyramid inside the selected range"
mode-effect-cone: "make a cone inside the selected range"

