help-header: "<gold>===== MaxFastBuild help =====</gold>"
help-line-mode: "<yellow>/mfb mode <shape></yellow> <gray>— set build shape</gray>"
help-line-pos1: "<yellow>/mfb pos1</yellow> <gray>— set corner 1 at your feet</gray>"
help-line-pos2: "<yellow>/mfb pos2</yellow> <gray>— set corner 2 at your feet</gray>"
help-line-pos3: "<yellow>/mfb pos3</yellow> <gray>— set the arc endpoint (arc mode only)</gray>"
help-line-array-spacing: "<yellow>/mfb array-spacing <x y z></yellow> <gray>— set array steps for all three axes (1–64)</gray>"
help-line-material: "<yellow>/mfb material <block id></yellow> <gray>— place material (e.g. minecraft:stone)</gray>"
help-line-hollow: "<yellow>/mfb hollow [true|false]</yellow> <gray>— hollow mode</gray>"
help-line-apply: "<yellow>/mfb apply</yellow> <gray>— submit from main hand: block=place/replace, tool=break, empty=reject</gray>"
help-line-status: "<yellow>/mfb status</yellow> <gray>— selection and tasks</gray>"
help-line-cancel: "<yellow>/mfb cancel</yellow> <gray>— cancel your active tasks</gray>"
help-line-about: "<yellow>/mfb about</yellow> <gray>— plugin information</gray>"
help-line-setblock: "<yellow>/mfbsetblock <x y z> <block> [replace|destroy|keep]</yellow> <gray>— MC /setblock compatible single block place</gray>"
help-line-help: "<yellow>/mfb help</yellow> <gray>— this help</gray>"
help-modes: "<gray>Available shapes and effects:</gray>"
help-line-preview: "<yellow>Selection preview</yellow> <gray>— pos1/pos2/pos3 send green-glass fake blocks only to you; apply or cancel clears it</gray>"
help-tip: "<gray>Flow: mode → pos1 → pos2 → hold block or tool → apply. Same hand rules as /__mfb. Or use the Fabric radial menu.</gray>"

